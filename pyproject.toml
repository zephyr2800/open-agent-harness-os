[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-harness-os"
version = "0.1.8"
description = "A local-first, model-agnostic harness for verifiable agent execution"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
harness-factorial = "experiments.factorial:main"
harness-replay = "traces.replay:main"
harness-preflight = "experiments.launch_preflight:main"
harness-scorecard = "experiments.scorecard:main"
harness-promotion-decision = "experiments.promotion_decision:main"
harness-agentdojo-adapter = "experiments.agentdojo_adapter_server:main"
harness = "app.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "protocol*", "runtime*", "tools*", "memory*", "traces*", "adapters*", "search*", "improve*", "benchmarks*", "experiments*"]
exclude = ["*.__pycache__", "*.__pycache__.*", "tests", "tests.*"]
namespaces = false

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]
